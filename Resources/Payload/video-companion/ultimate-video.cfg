// Ultimate Glass Video: profile-scoped companion bootstrap.
try {
  Services.obs.addObserver(function ready() {
    Services.obs.removeObserver(ready, 'final-ui-startup');
    try {
      const folder = Services.dirsvc.get('ProfD', Ci.nsIFile);
      folder.append('chrome'); folder.append('ultimate-glass-video');
      const entry = folder.clone(); entry.append('VideoCompanion.sys.mjs');
      if (!entry.exists()) return;
      // Local resource:// modules must not reuse bytecode from an older install.
      const parts=[];
      for(const child of folder.directoryEntries){
        const file=child.QueryInterface(Ci.nsIFile);
        if(file.leafName.endsWith('.sys.mjs'))parts.push(file.leafName+':'+file.lastModifiedTime+':'+file.fileSize);
      }
      const fingerprint=parts.sort().join('|');
      if(Services.prefs.getStringPref('mod.zenliquid.bootstrap-fingerprint','')!==fingerprint){
        Services.obs.notifyObservers(null,'startupcache-invalidate');
        Services.appinfo.invalidateCachesOnRestart();
        Services.prefs.setStringPref('mod.zenliquid.bootstrap-fingerprint',fingerprint);
      }
      const protocol = Services.io.getProtocolHandler('resource').QueryInterface(Ci.nsIResProtocolHandler);
      protocol.setSubstitution('ultimate-glass-video', Services.io.newFileURI(folder));
      ChromeUtils.importESModule('resource://ultimate-glass-video/AppSettings.sys.mjs').startSettingsBridge(()=>{
        ChromeUtils.importESModule('resource://ultimate-glass-video/VideoCompanion.sys.mjs').start();
      });
    } catch(e) { console.error('[Ultimate Glass Video bootstrap]', e); }
  }, 'final-ui-startup');
} catch(e) { console.error('[Ultimate Glass Video config]', e); }
